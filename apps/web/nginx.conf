server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health endpoint for the container healthcheck (no proxying).
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # API is proxied to the api container. The trailing URI "/" makes nginx strip
    # the /api/ prefix — Fastify serves its routes unprefixed (e.g. /api/health → /health).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 3m;
    }
    location /static/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        # Content-addressed filenames (T10) — cache forever.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # OAuth provider for Alice account linking (T50): Fastify serves /oauth/*
    # unprefixed, so proxy the path through unchanged (unlike /api/ above).
    location /oauth/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static app shell: hashed assets cache forever, index.html no-cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # PWA artifacts (T24.5): the service worker and its registration must
    # revalidate on every deploy or updates would never be picked up; the
    # manifest needs a correct MIME type for install prompts.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
